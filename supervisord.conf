[supervisord]
nodaemon=true

[program:vllm]
command=python3 -m vllm.entrypoints.openai.api_server --model huihui-ai/Qwen3-32B-abliterated --host 0.0.0.0 --port 8000 --gpu-memory-utilization 0.5 --max-model-len 32768 --trust-remote-code
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:flux]
command=python3 /app/flux_server.py
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
